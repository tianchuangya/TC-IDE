name: vscode extension

# Builds and tests the companion extension. It packages the .vsix so a broken
# manifest is caught here, and never creates a release: publishing is the
# project owner's decision, not a side effect of a green build.

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'vscode-extension/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: vscode-extension

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build bundles
        run: npm run build

      - name: Install the browser for the harness
        # Chromium is a 200MB download and the mirror can be slow or fail. It is
        # installed in its own step with a generous timeout so a flaky download
        # is reported as such instead of looking like a layout failure.
        timeout-minutes: 12
        run: |
          npx puppeteer browsers install chrome
          node -e "console.log(require('puppeteer').executablePath())"

      - name: Geometry assertions in a real browser
        # The harness renders the real markup and stylesheet and reads the DOM
        # back, which is the only way the layout numbers can be checked without
        # a person looking at a screenshot.
        run: node scripts/geometry-check.mjs

      - name: Capture the screenshots for review
        run: |
          TC_IDE_CHROMIUM="$(node -e "console.log(require('puppeteer').executablePath())")" \
            node scripts/capture-harness.mjs
          ls -l harness-shots

      - name: Check the packaged extension
        run: node scripts/verify-package.mjs --build

      - name: Upload the vsix
        uses: actions/upload-artifact@v4
        with:
          name: tc-ide-companion-vsix
          path: vscode-extension/tc-ide-companion.vsix
          if-no-files-found: error

      - name: Upload the screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: harness-shots
          path: vscode-extension/harness-shots
          if-no-files-found: error
