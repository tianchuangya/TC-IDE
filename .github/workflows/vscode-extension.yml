name: vscode extension

# Builds and tests the companion extension. It packages the .vsix so a broken
# manifest is caught here, and never creates a release: publishing is the
# project owner's decision, not a side effect of a green build.

on:
  push:
    branches: [main]
    paths:
      - 'vscode-extension/**'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    paths:
      - 'vscode-extension/**'
  workflow_dispatch:

defaults:
  run:
    working-directory: vscode-extension

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          # Pinned to a version the scripts are actually tested against. The
          # unit-test runner used to pass a glob to `node --test`, which Node 20
          # does not expand: it looked for a file literally named `*.test.js`
          # and failed, so CI was red while a newer local Node passed.
          node-version: '20.20.2'

      - name: Install dependencies
        run: npm ci || npm install --no-audit --no-fund

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build bundles
        run: npm run build

      - name: Install the browser and its system libraries
        # Chromium needs shared libraries that a bare runner does not carry, and
        # the download is large. Installing the libraries is the documented way
        # to make a headless browser work on ubuntu-24.04; skipping it makes the
        # launch fail with a missing-library message that reads like a layout
        # bug. Both are in their own step with a long timeout so a slow download
        # is reported as a download problem.
        timeout-minutes: 15
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 \
            libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 \
            libgbm1 libpango-1.0-0 libcairo2 libasound2t64
          npx puppeteer browsers install chrome
          node -e "console.log(require('puppeteer').executablePath())"

      - name: Geometry assertions in a real browser
        # The harness renders the real markup and stylesheet and reads the DOM
        # back, which is the only way the layout numbers can be checked without
        # a person looking at a screenshot.
        run: node scripts/geometry-check.mjs

      - name: Capture the screenshots for review
        run: |
          TC_IDE_CHROMIUM="$(node -e "console.log(require('puppeteer').executablePath())")" \
            node scripts/capture-harness.mjs
          ls -l harness-shots

      - name: Check the packaged extension
        run: node scripts/verify-package.mjs --build

      - name: Upload the vsix
        uses: actions/upload-artifact@v4
        with:
          name: tc-ide-companion-vsix
          path: vscode-extension/tc-ide-companion.vsix
          if-no-files-found: error

      - name: Upload the screenshots for visual review
        uses: actions/upload-artifact@v4
        with:
          name: harness-shots
          path: vscode-extension/harness-shots
          if-no-files-found: error
