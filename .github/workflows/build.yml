name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint the shared core and the Linux backend
        run: cargo clippy --all-targets -- -D warnings

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install native X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libcairo2-dev libpango1.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Install the Windows cross toolchain and Wine
        run: |
          sudo apt-get install --yes gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 wine
          rustup target add x86_64-pc-windows-gnu
      - name: Run the Windows state layer under Wine
        # The Windows backend is otherwise only exercised by the windows job,
        # whose log is not readable from a developer machine. Building it here
        # means a failure in the shared code shows up in the same run as the
        # Linux tests, with its output in front of whoever pushed.
        env:
          MINGW_ROOT: /usr
        run: bash tools/windows_selfcheck_wine.sh
      - name: Install headless X for the frame smoke test
        run: sudo apt-get install --yes xvfb
      - name: Render one native frame
        run: |
          xvfb-run -a cargo run -- --render-frame /tmp/tc-frame.png
          # The packaging animation only appears while a build runs, so it is
          # rendered through --render-scene instead of waiting for one.
          xvfb-run -a cargo run -- --render-frame /tmp/tc-packaging.png --render-scene packaging
          xvfb-run -a cargo run -- --render-frame /tmp/tc-emit.png --render-scene packaging-emit
          xvfb-run -a cargo run -- --render-frame /tmp/tc-edit.png --render-scene edit
          xvfb-run -a cargo run -- --render-frame /tmp/tc-debug.png --render-scene debug
          xvfb-run -a cargo run -- --render-frame /tmp/tc-view.png --render-scene view
          xvfb-run -a cargo run -- --render-frame /tmp/tc-filemenu.png --render-scene file-menu
          xvfb-run -a cargo run -- --render-frame /tmp/tc-ai.png --render-scene ai-panel
          xvfb-run -a cargo run -- --render-frame /tmp/tc-diagnostics.png --render-scene diagnostics
          xvfb-run -a cargo run -- --render-frame /tmp/tc-brackets.png --render-scene brackets
          xvfb-run -a cargo run -- --render-frame /tmp/tc-folding.png --render-scene folding
          xvfb-run -a cargo run -- --render-frame /tmp/tc-find.png --render-scene find
          xvfb-run -a cargo run -- --render-frame /tmp/tc-project-find.png --render-scene project-find
          xvfb-run -a cargo run -- --render-frame /tmp/tc-callees.png --render-scene graph-callees
          xvfb-run -a cargo run -- --render-frame /tmp/tc-relations.png --render-scene relations
          xvfb-run -a cargo run -- --render-frame /tmp/tc-crop.png --render-scene background-crop
          xvfb-run -a cargo run -- --render-frame /tmp/tc-hover.png --render-scene settings-hover
          xvfb-run -a cargo run -- --render-frame /tmp/tc-pressed.png --render-scene settings-controls
          xvfb-run -a cargo run -- --render-frame /tmp/tc-syntax-colors.png --render-scene syntax-colors
          xvfb-run -a cargo run -- --render-frame /tmp/tc-scrolling.png --render-scene scrolling
          xvfb-run -a cargo run -- --render-frame /tmp/tc-plugins.png --render-scene plugins
          xvfb-run -a cargo run -- --render-frame /tmp/tc-menu-keyboard.png --render-scene menu-keyboard
          xvfb-run -a cargo run -- --render-frame /tmp/tc-menu-hover.png --render-scene menu-hover
          python3 - <<'PY'
          import os
          import sys

          frames = [
              "/tmp/tc-frame.png",
              "/tmp/tc-packaging.png",
              "/tmp/tc-emit.png",
              "/tmp/tc-edit.png",
              "/tmp/tc-debug.png",
              "/tmp/tc-view.png",
              "/tmp/tc-filemenu.png",
              "/tmp/tc-ai.png",
              "/tmp/tc-diagnostics.png",
              "/tmp/tc-brackets.png",
              "/tmp/tc-folding.png",
              "/tmp/tc-find.png",
              "/tmp/tc-project-find.png",
              "/tmp/tc-callees.png",
              "/tmp/tc-relations.png",
              "/tmp/tc-crop.png",
              "/tmp/tc-hover.png",
              "/tmp/tc-pressed.png",
              "/tmp/tc-syntax-colors.png",
              "/tmp/tc-scrolling.png",
              "/tmp/tc-plugins.png",
              "/tmp/tc-menu-keyboard.png",
              "/tmp/tc-menu-hover.png",
          ]
          sizes = {path: os.path.getsize(path) for path in frames}
          for path, size in sizes.items():
              print("rendered frame bytes:", path, size)
          # Every frame has to carry real content, and the packaging scenes have
          # to differ from the plain editor frame: identical bytes would mean
          # --render-scene silently stopped priming the animation.
          editor = sizes["/tmp/tc-frame.png"]
          # Every primed scene must differ from the plain editor frame.
          ok = all(size > 20_000 for size in sizes.values()) and all(
              sizes[path] != editor for path in frames[1:]
          )
          sys.exit(0 if ok else 1)
          PY

  windows-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, x86_64-apple-darwin
          components: clippy
      - name: Type check the Win32 backend without linking
        run: cargo check --all-targets --target x86_64-pc-windows-msvc
      - name: Lint the Win32 backend without linking
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings
      # The Cocoa backend is type checked and linted on Linux as well, so a
      # mistake shows up before the macOS job spends a runner on it.
      - name: Type check the Cocoa backend without linking
        run: cargo check --all-targets --target x86_64-apple-darwin
      - name: Lint the Cocoa backend without linking
        run: cargo clippy --all-targets --target x86_64-apple-darwin -- -D warnings

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Windows editor and ConPTY state
        run: cargo test --all-targets
      - name: Build and link native Win32 backend
        run: cargo build --release
      - name: Run the scriptable state layer check
        run: cargo run --release -- --self-check

  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated macOS backend
        run: cargo build --release
      # The state layer check runs on the runner, so the Cocoa backend is
      # executed here and not only compiled.
      - name: Run the scriptable state layer check
        run: ./target/release/tc-ide --self-check
      - name: Run the unit tests
        run: cargo test --all-targets
