name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint the shared core and the Linux backend
        run: cargo clippy --all-targets -- -D warnings

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install native X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libcairo2-dev libpango1.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Install headless X for the frame smoke test
        run: sudo apt-get install --yes xvfb
      - name: Render one native frame
        run: |
          xvfb-run -a cargo run -- --render-frame /tmp/tc-frame.png
          python3 - <<'PY'
          import os
          import sys

          size = os.path.getsize("/tmp/tc-frame.png")
          print("rendered frame bytes:", size)
          sys.exit(0 if size > 20_000 else 1)
          PY

  windows-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Type check the Win32 backend without linking
        run: cargo check --all-targets --target x86_64-pc-windows-msvc
      - name: Lint the Win32 backend without linking
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Windows editor and ConPTY state
        run: cargo test --all-targets
      - name: Build and link native Win32 backend
        run: cargo build --release
      - name: Run the scriptable state layer check
        run: cargo run --release -- --self-check

  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated macOS backend
        run: cargo build --release
