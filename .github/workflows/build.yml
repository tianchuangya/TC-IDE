name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint the shared core and the Linux backend
        run: cargo clippy --all-targets -- -D warnings

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install native X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libcairo2-dev libpango1.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets
      - name: Install headless X for the frame smoke test
        run: sudo apt-get install --yes xvfb
      - name: Render one native frame
        run: |
          xvfb-run -a cargo run -- --render-frame /tmp/tc-frame.png
          # The packaging animation only appears while a build runs, so it is
          # rendered through --render-scene instead of waiting for one.
          xvfb-run -a cargo run -- --render-frame /tmp/tc-packaging.png --render-scene packaging
          xvfb-run -a cargo run -- --render-frame /tmp/tc-emit.png --render-scene packaging-emit
          xvfb-run -a cargo run -- --render-frame /tmp/tc-edit.png --render-scene edit
          xvfb-run -a cargo run -- --render-frame /tmp/tc-callees.png --render-scene graph-callees
          xvfb-run -a cargo run -- --render-frame /tmp/tc-crop.png --render-scene background-crop
          python3 - <<'PY'
          import os
          import sys

          frames = [
              "/tmp/tc-frame.png",
              "/tmp/tc-packaging.png",
              "/tmp/tc-emit.png",
              "/tmp/tc-edit.png",
              "/tmp/tc-callees.png",
              "/tmp/tc-crop.png",
          ]
          sizes = {path: os.path.getsize(path) for path in frames}
          for path, size in sizes.items():
              print("rendered frame bytes:", path, size)
          # Every frame has to carry real content, and the packaging scenes have
          # to differ from the plain editor frame: identical bytes would mean
          # --render-scene silently stopped priming the animation.
          editor = sizes["/tmp/tc-frame.png"]
          # The relation graph scene needs a member call in the fixture, so it
          # only has to be a real frame; the others must differ from the editor.
          ok = all(size > 20_000 for size in sizes.values()) and all(
              sizes[path] != editor for path in frames[1:-1]
          )
          sys.exit(0 if ok else 1)
          PY

  windows-typecheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - name: Type check the Win32 backend without linking
        run: cargo check --all-targets --target x86_64-pc-windows-msvc
      - name: Lint the Win32 backend without linking
        run: cargo clippy --all-targets --target x86_64-pc-windows-msvc -- -D warnings

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test Windows editor and ConPTY state
        run: cargo test --all-targets
      - name: Build and link native Win32 backend
        run: cargo build --release
      - name: Run the scriptable state layer check
        run: cargo run --release -- --self-check

  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated macOS backend
        run: cargo build --release
