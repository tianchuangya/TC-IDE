name: build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install native X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libcairo2-dev libpango1.0-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Check
        run: cargo check --all-targets
      - name: Test
        run: cargo test --all-targets

  windows:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and link native Win32 backend
        run: cargo build --release

  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated macOS backend
        run: cargo build --release
