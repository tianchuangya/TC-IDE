name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install native X11 development libraries
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev
      - uses: dtolnay/rust-toolchain@stable
      - name: Test
        run: cargo test --all-targets
      - name: Build release binary
        run: cargo build --release
      - name: Package Linux release
        run: |
          package_dir="TC-IDE-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir -p "dist/${package_dir}"
          install -m 755 target/release/tc-ide "dist/${package_dir}/tc-ide"
          install -m 644 README.md LICENSE "dist/${package_dir}/"
          install -m 644 TC-IDE.desktop "dist/${package_dir}/"
          mkdir -p "dist/${package_dir}/assets"
          install -m 644 assets/tc-ide-icon.png "dist/${package_dir}/assets/"
          tar -C dist -czf "dist/${package_dir}.tar.gz" "${package_dir}"
          sha256sum "dist/${package_dir}.tar.gz" > "dist/${package_dir}.tar.gz.sha256"
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.tar.gz \
            dist/*.sha256 \
            --title "TC-IDE ${GITHUB_REF_NAME}" \
            --generate-notes
